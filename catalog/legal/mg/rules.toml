# --- Bacia do rio Doce (Portaria IEF 31/2025) --------------------------------------

[[rule]]
id = "doce-nativas-permanente"
act = "ief-31-2025"
articles = "art. 3º; art. 4º, parágrafo único"
basins = ["doce"]
period = { kind = "permanent" }
species = "native"
scope = "basin"
effect = "prohibited"
summary = "Pesca de espécies autóctones vedada o ano todo em toda a bacia do Doce em MG; capturas acidentais devolvidas, com tolerância de 1 kg + 1 exemplar em caso de morte no manuseio."
evidence = [
  { segment = "art3", quote = "Fica vedada a pesca de espécies autóctones em toda a bacia do rio Doce, nos limites do Estado de Minas Gerais." },
  { segment = "art4/par-unico", quote = "Em caso de captura acidental de espécie autóctone, os espécimes deverão ser devolvidos imediatamente ao corpo d’água" },
]

[[rule]]
id = "doce-nao-nativas"
act = "ief-31-2025"
articles = "art. 4º; arts. 5º a 7º"
basins = ["doce"]
period = { kind = "permanent" }
species = "non_native"
scope = "basin"
effect = "conditional"
summary = "Captura de alóctones, exóticas e híbridos permitida com licença, cotas e petrechos listados; redes de emalhe vedadas."
conditions = [
  "licença de pesca",
  "amador: 10 kg + 1 exemplar de qualquer tamanho acima do mínimo legal",
  "profissional: sem limite de cota",
  "amador: anzol simples ou múltiplo, linha de mão, vara ou caniço, molinete ou carretilha, iscas, embarcação",
  "profissional: também tarrafa, espinhel, caçador, pinda, joão bobo e similares (art. 6º)",
  "vedados petrechos não listados, especialmente redes de emalhe",
  "durante o defeso valem também as regras da Portaria IEF 155/2011 (mais restritivas)",
]
evidence = [
  { segment = "art4", quote = "É permitida a captura e o transporte de espécies alóctones, de espécies exóticas e de espécimes híbridos" },
  { segment = "art4/I/b", quote = "limite de cota de 10 kg (dez quilogramas) mais um exemplar de qualquer tamanho acima do mínimo estabelecido pela legislação vigente" },
  { segment = "art4/II/b", quote = "sem limite de cota." },
  { segment = "art5", quote = "Os petrechos empregados para pesca amadora na bacia do rio Doce" },
  { segment = "art6", quote = "Os petrechos empregados na pesca profissional na bacia do rio Doce" },
  { segment = "art7", quote = "Ficam vedados todos os petrechos e artes de pesca não explicitamente autorizados nesta portaria, especialmente o uso de redes de emalhe." },
]

