  { segment = "art1", quote = "de 1º de novembro a 28 de fevereiro, na bacia hidrográfica dos Rios Grande e Paranaíba" },
  { segment = "art2", quote = "Proibir a captura, o transporte e o armazenamento de espécies nativas da bacia hidrográfica dos Rios Grande e Paranaíba" },
