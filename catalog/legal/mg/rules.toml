  { segment = "art7/II", quote = "Exclusivamente espécies não nativas (alóctones, exóticas e híbridos)" },
  { segment = "art7/IV", quote = "Captura e transporte de 3 (três) kg de peixes mais um exemplar para o pescador profissional e cota de 3 (três) kg mais um exemplar para o pescador amador, por dia ou jornada de pesca" },
  { segment = "art7/IV", quote = "Excetua-se desta permissão o piauçu (Leporinus macrocephalus)" },
  { segment = "art7/par2", quote = "Proibir a utilização de animais aquáticos, inclusive peixes, camarões, caramujos, caranguejos, vivos ou mortos (inteiros ou em pedaços), como iscas." },
  { segment = "art7/par3", quote = "Fica estabelecida a cota para a pesca profissional exclusivamente para consumo familiar, sendo vetado a comercialização dos peixes capturados durante o período de defeso" },
]

[[rule]]
id = "gp-defeso-faixas"
act = "ief-156-2011"
articles = "art. 3º, I a V"
basins = ["grande", "paranaiba"]
period = { kind = "annual", start = "11-01", end = "02-28" }
species = "all"
scope = "buffer"
effect = "prohibited"
geo_mapping = "pending"
summary = "Proibida a pesca em lagoas marginais; 500 m de confluências e esgotos; 1.500 m a montante e jusante de barragens de UHE, mecanismos de transposição, cachoeiras e corredeiras; 500 m a jusante de outras barragens."
