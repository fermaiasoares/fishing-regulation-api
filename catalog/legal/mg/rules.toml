# Regras extraídas dos atos em acts.toml.
#
# basins: identificadores de catalog/legal/mg/basins.toml.
# period.kind: "annual" (start/end em MM-DD, podendo virar o ano) ou "permanent".
# species: "native" (autóctones da bacia), "non_native" (alóctones, exóticas, híbridos),
#          "all" (qualquer espécie), "threatened" (espécie presente em species_list).
# scope: "basin" (vale para toda a bacia), "buffer" (faixas de distância, lagoas etc.),
#        "stretch" (trechos de rio nomeados). Só regras "basin" entram na matriz por bacia;
#        "buffer" e "stretch" dependem do mapeamento geográfico (geo_mapping = "pending").
# effect: "prohibited" ou "conditional". O catálogo não contém regras "allowed":
#         a ausência de proibição nunca vira permissão.
# evidence: trechos literais que fundamentam a regra, cada um com o id do segmento em
#           sources/<ato>.segments.json. Se o texto do ato está armazenado, toda regra
#           precisa de evidência, e cada trecho precisa existir no segmento indicado.

# --- Bacia do rio São Francisco (Portaria IEF 154/2011) ---------------------------

[[rule]]
id = "sf-defeso-nativas"
act = "ief-154-2011"
articles = "art. 1º; art. 2º, I"
basins = ["sao_francisco"]
period = { kind = "annual", start = "11-01", end = "02-28" }
species = "native"
scope = "basin"
effect = "prohibited"
summary = "Proibidos captura, porte, transporte, comércio e consumo de espécies nativas da bacia durante o defeso."
evidence = [
  { segment = "art1", quote = "Fixar anualmente o período de 1º de novembro a 28 de fevereiro, para o defeso da piracema na Bacia Hidrográfica do Rio São Francisco" },
  { segment = "art2/I", quote = "A captura e o respectivo porte, transporte, comércio, armazenamento, consumo e utilização para qualquer finalidade de espécies nativas da bacia hidrográfica do Rio São Francisco" },
]

[[rule]]
id = "sf-defeso-nao-nativas"
act = "ief-154-2011"
articles = "art. 2º, § 2º; art. 4º, I a IV; art. 5º, I a III"
basins = ["sao_francisco"]
period = { kind = "annual", start = "11-01", end = "02-28" }
species = "non_native"
scope = "basin"
effect = "conditional"
summary = "Pesca amadora e profissional, embarcada ou desembarcada, só de espécies alóctones, exóticas ou híbridas listadas no art. 5º."
conditions = [
  "licença ou autorização do órgão ambiental",
  "limite de 3 kg + 1 exemplar por pescador, por dia ou jornada",
  "linha de mão, anzol simples, vara ou caniço, molinete e carretilha; garatéia só com isca artificial; até 5 varas por pescador",
  "proibida a técnica da lambada",
  "pesca profissional só para consumo familiar, sem comercialização",
]
evidence = [
  { segment = "art4", quote = "Permitir a pesca amadora, profissional, embarcada e desembarcada, somente para espécies exóticas, alóctones ou híbridas, constantes no art. 5º desta Portaria" },
  { segment = "art4/I", quote = "Portando a licença ou autorização do órgão ambiental competente" },
  { segment = "art4/II", quote = "Com limite para captura de 3 (três) kg de peixes mais um exemplar por pescador amador e 3 (três) kg de peixes mais um exemplar para o pescador profissional" },
  { segment = "art4/IV", quote = "sendo vedado a prática da técnica da lambada" },
  { segment = "art4/IV", quote = "limitados a 05 (cinco) varas e caniços por pescador licenciado" },
  { segment = "art2/par2", quote = "Fica estabelecida a cota para a pesca profissional exclusivamente para consumo familiar, sendo vetada a comercialização dos peixes capturados durante o período de defeso" },
]

[[rule]]
id = "sf-defeso-faixas"
act = "ief-154-2011"
articles = "art. 2º, III, a, b, d, e, f, i, k"
basins = ["sao_francisco"]
period = { kind = "annual", start = "11-01", end = "02-28" }
species = "all"
scope = "buffer"
effect = "prohibited"
geo_mapping = "pending"
summary = "Proibida a pesca: 1.000 m a montante e a jusante de barragens, UHEs, cachoeiras e corredeiras; 500 m de confluências, desembocaduras, lagoas, canais e esgotos; 300 m de barramentos; lagoas marginais; cursos d'água com até 20 m de largura; UCs de proteção integral e 10 km no entorno sem plano de manejo."
evidence = [
  { segment = "art2/III/a", quote = "No perímetro compreendido entre 1.000 (um mil) metros à montante e à jusante das barragens, usinas hidrelétricas, cachoeiras e corredeiras" },
  { segment = "art2/III/b", quote = "A menos de 500 (quinhentos) metros à montante e à jusante da confluência e desembocadura de rios, lagoas, canais e tubulações de esgotos" },
  { segment = "art2/III/d", quote = "No interior das unidades de conservação e proteção integral e seu entorno num raio de 10 quilômetros, quando não houver plano de manejo" },
  { segment = "art2/III/e", quote = "Nas lagoas marginais temporárias ou permanentes e criadouros naturais" },
  { segment = "art2/III/f", quote = "A menos de 300m (trezentos metros) dos barramentos" },
  { segment = "art2/III/i", quote = "Nos cursos d’água, cuja lâmina d’água possua largura igual ou inferior a 20 metros" },
  { segment = "art2/III/k", quote = "Para todas as categorias e modalidades, nas lagoas marginais" },
]

[[rule]]
id = "sf-defeso-rios-fechados"
act = "ief-154-2011"
articles = "art. 2º, III, g, h, j, l, m"
basins = ["sao_francisco"]
period = { kind = "annual", start = "11-01", end = "02-28" }
species = "all"
scope = "stretch"
effect = "prohibited"
geo_mapping = "pending"
stretches = [
  "Rio Pandeiros e todos os afluentes, em toda a extensão",
  "Rio da Prata, da nascente à foz no Rio Paracatu, em Lagoa Grande",
  "Rio Cipó e afluentes, da nascente à foz no Rio Paraúna",
  "Rio Abaeté e afluentes, da nascente à foz no São Francisco",
  "Rio do Sono, da Cachoeira das Almas (divisa João Pinheiro/Buritizeiro) à foz no Rio Paracatu",
]
summary = "Pesca proibida em todos os trechos listados durante o defeso."
evidence = [
  { segment = "art2/III/g", quote = "No Rio Pandeiros e nos seus afluentes, em toda a sua extensão" },
  { segment = "art2/III/h", quote = "No Rio da Prata, de sua nascente até sua foz no Rio Paracatu, no Município de Lagoa Grande" },
  { segment = "art2/III/j", quote = "No rio Cipó e seus afluentes, da nascente à foz com o Rio Paraúna" },
  { segment = "art2/III/l", quote = "No rio Abaeté e seus afluentes, de sua nascente até a sua desembocadura no rio São Francisco" },
  { segment = "art2/III/m", quote = "No rio do Sono, da Cachoeira das Almas divisa de municípios de João Pinheiro e Buritizeiro até sua foz no rio Paracatu" },
]

[[rule]]
id = "sf-lagoas-marginais-federal"
act = "ibama-50-2007"
articles = "art. 1º, § 2º"
basins = ["sao_francisco"]
period = { kind = "annual", start = "11-01", end = "04-30" }
species = "all"
scope = "buffer"
effect = "prohibited"
geo_mapping = "pending"
summary = "Pesca de qualquer categoria, modalidade e petrecho proibida nas lagoas marginais de 1º/11 a 30/04 (federal; estende o prazo estadual)."

# --- Bacias do Leste (Portaria IEF 155/2011) --------------------------------------

[[rule]]
id = "leste-defeso-nativas"
act = "ief-155-2011"
articles = "art. 1º; art. 7º"
basins = ["leste"]
period = { kind = "annual", start = "11-01", end = "02-28" }
species = "native"
scope = "basin"
effect = "prohibited"
summary = "Durante o defeso só é permitida a captura e o transporte de espécies não nativas; nativas ficam proibidas."
evidence = [
  { segment = "art1", quote = "Fixar anualmente o período de 1º de novembro a 28 de fevereiro, para o defeso da piracema na Bacia Hidrográfica do Leste" },
  { segment = "art7", quote = "Permitir a captura e o transporte somente de espécies não nativas (alóctones e exóticas e híbridos)" },
]

[[rule]]
id = "leste-defeso-nao-nativas"
act = "ief-155-2011"
articles = "art. 5º; art. 6º, I; art. 7º"
basins = ["leste"]
period = { kind = "annual", start = "11-01", end = "02-28" }
species = "non_native"
scope = "basin"
effect = "conditional"
summary = "Captura de alóctones, exóticas e híbridos permitida com restrições de modalidade e cota."
conditions = [
  "limite de 3 kg + 1 exemplar por jornada (amador e profissional)",
  "nos rios, só pesca desembarcada com linha de mão, caniço, vara com molinete ou carretilha",
  "nos reservatórios, embarcada ou desembarcada; proibida a lambada",
]
evidence = [
  { segment = "art7", quote = "com cota de 3 (três) kg mais um exemplar para a pesca profissional e amadora, por jornada de pesca" },
  { segment = "art5", quote = "Permitir, nos rios das bacias hidrográficas do leste, apenas a pesca desembarcada e utilizando somente linha de mão, caniço, vara com molinete ou carretilha" },
  { segment = "art6", quote = "Permitir, nos reservatórios das bacias hidrográficas referenciadas no art. 1º, a pesca embarcada e desembarcada" },
  { segment = "art6/I", quote = "exceto pelo processo de lambada" },
]

[[rule]]
id = "leste-defeso-faixas"
act = "ief-155-2011"
articles = "art. 2º, I a V"
basins = ["leste"]
period = { kind = "annual", start = "11-01", end = "02-28" }
species = "all"
scope = "buffer"
effect = "prohibited"
geo_mapping = "pending"
summary = "Proibida a pesca em lagoas marginais; 1.000 m de barragens de UHEs, cachoeiras e corredeiras; 300 m de outros barramentos; 500 m de confluências e esgotos urbanos; cursos d'água com até 20 m de largura."
evidence = [
  { segment = "art2/I", quote = "Nas lagoas marginais" },
  { segment = "art2/II", quote = "Até 1000 (um mil) metros a montante e a jusante das barragens de reservatórios de usinas hidrelétricas, cachoeiras e corredeiras" },
  { segment = "art2/III", quote = "Até 300 metros dos demais barramentos" },
  { segment = "art2/IV", quote = "A menos de 500m (quinhentos metros) da confluência do rio principal com seus afluentes e das saídas de esgotos urbanos" },
  { segment = "art2/V", quote = "Nos cursos d’água, cuja lâmina d’água possua largura igual ou inferior a 20 metros" },
]

[[rule]]
id = "leste-defeso-federal"
act = "ibama-in-196-2008"
articles = "arts. 1º a 3º"
basins = ["leste"]
period = { kind = "annual", start = "11-01", end = "02-28" }
species = "native"
scope = "basin"
effect = "prohibited"
summary = "Defeso federal nas bacias do Leste (exceto São Francisco); só não nativas podem ser capturadas. A cota federal (amador 10 kg + 1) é menos restritiva que a estadual."

# --- Bacias dos rios Grande e Paranaíba (Portaria IEF 156/2011) --------------------

[[rule]]
