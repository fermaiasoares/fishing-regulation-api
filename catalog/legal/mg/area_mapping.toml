# Ligação entre as Circunscrições Hidrográficas (CHs) de Minas Gerais e as áreas
# legais do catálogo (basins.toml). Fonte das CHs: IDE-Sisema/Igam, camada
# ide_1108_mg_circunscricoes_hidrograficas_pol (DN CERH-MG 66/2020 e 95/2024).
#
# "code" vale para uma CH específica e tem precedência sobre "prefix";
# "name_contains" e "federal_basin" conferem o nome e o atributo bacia_fede da CH
# antes de aceitar a ligação.
# Uma CH que nenhuma linha cobre faz a ingestão falhar: nada é adivinhado.

[[district]]
code = "SF3"
federal_basin = "Rio São Francisco"
area = "paraopeba"
name_contains = "Paraopeba"
reason = "SF3 é a CH do Rio Paraopeba, sub-bacia do São Francisco."

