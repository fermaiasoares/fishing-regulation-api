# Listas de espécies citadas pelos atos, transcritas do texto armazenado em
# sources/<ato>.txt (grafia original preservada, inclusive erros como "Cicla").
# "basin" indica a área onde a classificação vale (códigos separados por vírgula).
#
# As listas não são exaustivas: uma espécie fora da lista NÃO é presumida não
# nativa. Sem classificação, a avaliação resulta em "undetermined".
# Formato de cada entrada: "Nome comum ou Outro nome (Nome científico e Outro)".
# Em híbridos, o parêntese descreve o cruzamento e não classifica os genitores.

[[list]]
id = "ief-154-2011-art5"
act = "ief-154-2011"
basin = "sao_francisco"
segment = "art5"
note = "O art. 5º, IV lista autóctones entre as espécies autorizadas, mas o art. 4º só permite exóticas, alóctones ou híbridas. Essas espécies são tratadas como conflito (undetermined)."
aloctone = [
  "Tucunaré (Cicla spp.)", "Tambaqui (Colossoma macropomum)", "Apaiari (Astronotus ocellatus)",
  "Pescada do Piauí (Plagioscion squamosissimus)", "Caranha Amarela ou Pacu (Piaractus mesopotamicus)",
  "Caranha Preta ou Pirapitinga ou Pacu (Piaractus brachypomus)", "Cachara (Pseudoplatystoma fasciatum)",
  "Trairão (Hoplias lacerdae)", "Piranha Vermelha (Pygocentrus nattereri)", "Piranha Preta (Serrassalmus rhombeus)",
]
exotic = [
  "Tilápias (Oreochromis niloticus e Tilapia rendalli)", "Bagre Africano (Clarias gariepinus)",
  "Catfish (Ictalurus punctatus)", "Carpa Comum (Cyprinus carpio)", "Carpa Espelho (Cyprinus carpio specularis)",
  "Carpa Capim (Ctenopharyngodon idella)", "Carpa Prateada (Hypophtalmichthys molitrix)",
  "Carpa Cabeçuda (Anstichtys nobilis)", "Black Bass (Micropterus salmoides)",
]
hybrid = [
  "Tambacu (Colossoma macropomum X Piaractus masopotamicus)",
  "Ponto e Vírgula ou Pintachara (Pseudoplatystoma corruscans X Pseudoplatystoma fasciatum)",
]
native_listed_as_capturable = [
  "Piranha (Pygocentrus piraya)", "Pirambeba (Serrasalmus branditii)",
  "Camboge ou Tamoatá (Hoplosternum sp e Callichthys callichthys)",
]

