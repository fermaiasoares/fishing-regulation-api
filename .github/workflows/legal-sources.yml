name: Legal sources

# Downloads the official texts listed in catalog/legal/mg/acts.toml, extracts and
# segments them, and commits the result to the pull request branch so that every
# rule can be checked against the exact text it cites.
on:
  pull_request:
    paths:
      - catalog/legal/mg/acts.toml
      - services/legal-catalog/sources.py
      - .github/workflows/legal-sources.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: legal-sources-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  acquire:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Download, extract and segment
        working-directory: services/legal-catalog
        run: python3 sources.py ../../catalog/legal/mg | tee ../../legal-sources-report.json
      - name: Summary
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          report = json.load(open("legal-sources-report.json"))
          print("| Ato | Status | URL | SHA-256 | Segmentos |")
          print("| --- | --- | --- | --- | --- |")
          for act, entry in sorted(report.items()):
              print(f"| {act} | {entry['status']} | {entry.get('url', '')} | {entry.get('sha256', '')[:16]} | {entry.get('segments', '')} |")
          EOF
      - name: Commit extracted texts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/legal/mg/sources
          if git diff --cached --quiet; then
            echo "No changes in legal sources."
          else
            git commit -m "Update official legal source texts" -m "Generated by the legal-sources workflow."
            git push
          fi
