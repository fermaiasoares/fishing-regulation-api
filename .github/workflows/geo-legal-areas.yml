name: Geo legal areas

# Downloads the official hydrographic districts of Minas Gerais (IDE-Sisema/Igam),
# validates them against catalog/legal/mg/area_mapping.toml and commits the raw
# response (gzip) with its manifest to the pull request branch.
on:
  pull_request:
    paths:
      - services/geo-ingestion/legal_areas.py
      - catalog/legal/mg/area_mapping.toml
      - .github/workflows/geo-legal-areas.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geo-legal-areas-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  acquire:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Download and validate districts
        run: python3 services/geo-ingestion/legal_areas.py catalog/geo/mg --mapping catalog/legal/mg/area_mapping.toml
      - name: Commit source data
        run: |
          ls -l catalog/geo/mg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/geo/mg
          if git diff --cached --quiet; then
            echo "No changes in geographic sources."
          else
            git commit -m "Update official hydrographic districts of Minas Gerais" -m "Generated by the geo-legal-areas workflow."
            git push
          fi
