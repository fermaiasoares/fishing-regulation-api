name: CI

on:
  push:
    branches: [master, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [master, 'feat/laravel-bootstrap']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  laravel:
    name: Compose, PostGIS, Redis and Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_DB: fishing_test
      POSTGRES_PASSWORD: ci-local-only-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate legal catalog
        working-directory: services/legal-catalog
        run: |
          for catalog in ../../catalog/legal/*/; do
            python3 catalog.py "$catalog" --check-export "${catalog}catalog.json"
          done
          python3 -m unittest discover -s tests -v
          python3 -m venv /tmp/pdf-venv
          /tmp/pdf-venv/bin/pip install --quiet pdfplumber==0.11.10
          /tmp/pdf-venv/bin/python annex_1667.py ../../catalog/legal/br --check
      - name: Validate geographic sources
        working-directory: services/geo-ingestion
        run: |
          python3 legal_areas.py ../../catalog/geo/mg --mapping ../../catalog/legal/mg/area_mapping.toml --basins ../../catalog/legal/mg/basins.toml --check
          python3 -m unittest discover -s tests -v
      - name: Validate Compose syntax
        run: docker compose -f infrastructure/compose.yaml config --quiet
      - name: Prepare Laravel environment
        run: cp apps/api/.env.example apps/api/.env
      - name: Build the API and start dependencies
        run: |
          docker compose -f infrastructure/compose.yaml build api
          docker compose -f infrastructure/compose.yaml up -d --wait db redis
      - name: Install locked dependencies
        run: docker compose -f infrastructure/compose.yaml run --rm --no-deps api composer install --no-interaction --prefer-dist --no-progress
      - name: Generate an ephemeral application key
        run: docker compose -f infrastructure/compose.yaml run --rm --no-deps api php artisan key:generate --force
      - name: Enable PostGIS
        run: docker compose -f infrastructure/compose.yaml exec -T db psql -U fishing -d fishing_test -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS postgis;'
      - name: Run migrations
        run: docker compose -f infrastructure/compose.yaml run --rm --no-deps api php artisan migrate --force --step
      - name: Start API and verify readiness
        run: |
          docker compose -f infrastructure/compose.yaml up -d api
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-max-time 60 http://127.0.0.1:8000/api/health
      - name: Run Laravel tests
        run: docker compose -f infrastructure/compose.yaml exec -T api php artisan test
      - name: Import the legal catalog twice (idempotency)
        run: |
          docker compose -f infrastructure/compose.yaml exec -T api php artisan legal:import --publish
          docker compose -f infrastructure/compose.yaml exec -T api php artisan legal:import --publish | grep -q "already imported"
      - name: Import official legal areas twice (idempotency)
        run: |
          docker compose -f infrastructure/compose.yaml exec -T api php artisan geo:import-legal-areas
          docker compose -f infrastructure/compose.yaml exec -T api php artisan geo:import-legal-areas | grep -q "already imported"
      - name: Verify geographic and legal migration rollback and reapply
        run: |
          docker compose -f infrastructure/compose.yaml exec -T api php artisan migrate:rollback --force --step=6
          result="$(docker compose -f infrastructure/compose.yaml exec -T db psql -U fishing -d fishing_test -v ON_ERROR_STOP=1 -Atc "SELECT to_regclass('geographic_datasets') IS NULL AND to_regclass('geographic_dataset_versions') IS NULL AND to_regclass('hydrographic_basins') IS NULL AND to_regclass('river_segments') IS NULL AND to_regclass('legal_rules') IS NULL AND to_regclass('legal_area_geometries') IS NULL AND to_regclass('legal_catalog_versions') IS NULL AND PostGIS_Version() IS NOT NULL")"
          test "$result" = t
          docker compose -f infrastructure/compose.yaml exec -T api php artisan migrate --force --step
      - name: Audit Composer dependencies
        run: docker compose -f infrastructure/compose.yaml exec -T api composer audit --locked
      - name: Logs on failure
        if: failure()
        run: docker compose -f infrastructure/compose.yaml logs --no-color
      - name: Stop ephemeral CI services
        if: always()
        run: docker compose -f infrastructure/compose.yaml down -v --remove-orphans

  pwa:
    name: Sample PWA (typecheck and build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/pwa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/pwa/package-lock.json
      - run: npm ci
      - run: npm run build
